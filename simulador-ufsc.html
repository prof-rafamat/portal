<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador UFSC | RafaMat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080a0f; 
            --accent-color: #00d4ff; 
            --danger-color: #ff3366; 
            --text-main: #e6edf3;
            --card-bg: #11141d;
            --header-bg: rgba(8, 10, 15, 0.95);
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            background-image: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
        }

        .pixel-font { font-family: 'VT323', monospace; }

        header { 
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 5%; 
            background: var(--header-bg); 
            border-bottom: 2px solid var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .btn-voltar {
            color: var(--danger-color);
            text-decoration: none;
            border: 2px solid var(--danger-color);
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .btn-voltar:hover {
            background: var(--danger-color);
            color: #000;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        .logo { font-weight: bold; font-size: 1.5rem; letter-spacing: 2px; }
        .logo span { color: var(--accent-color); }

        .high-score-panel { text-align: right; }
        .high-score-val { color: var(--accent-color); font-size: 2.5rem; margin: 0; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }

        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }

        .pixel-logo-ufsc {
            width: 120px;
            height: auto;
            display: block;
            margin: 0 auto 1.5rem auto;
            image-rendering: pixelated; 
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.4));
        }

        .arcade-box { 
            background: var(--card-bg); 
            padding: 1.5rem; 
            border: 2px solid #30363d; 
            border-radius: 4px;
            margin-bottom: 2rem;
        }

        .bloco-titulo {
            border-bottom: 2px dashed var(--accent-color);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .questão-row {
            display: grid;
            grid-template-columns: 50px 90px 1fr 1fr 80px;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.5rem;
            padding: 5px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #1f242e;
            border-radius: 4px;
        }

        .questão-row:hover { border-color: var(--accent-color); }

        label { color: var(--text-main); font-size: 1rem; }

        select.limite-select {
            background: #000;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 2px;
            font-size: 1rem;
            border-radius: 4px;
            width: 100%;
            outline: none;
        }
        select.limite-select:focus { border-color: var(--accent-color); }

        input { 
            background: #000;
            border: 1px solid #30363d;
            color: var(--accent-color);
            padding: 6px;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--accent-color); outline: none; }
        input:invalid { border-color: var(--danger-color); color: var(--danger-color); }

        .status-badge {
            background: #000;
            padding: 6px;
            border: 1px solid #30363d;
            text-align: center;
            color: #555;
            font-size: 1.2rem;
            border-radius: 4px;
        }

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .footer-note { text-align: center; color: #555; margin-top: 2rem; font-size: 0.9rem; }

    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <a href="laboratorio.html" class="pixel-font btn-voltar">&lt; LOBBY</a>
            <div class="logo pixel-font" style="font-size: 2rem; color: #fff;">Simulador<span style="color: var(--accent-color);">UFSC</span></div>
        </div>
        <div class="high-score-panel">
            <p class="pixel-font" style="margin:0; color: #8b949e; font-size: 1.2rem;">PONTUAÇÃO BRUTA TOTAL</p>
            <p id="totalScore" class="pixel-font high-score-val">00.00</p>
        </div>
    </header>

    <main class="container">
        
        <img src="logo_ufsc_16bit.png" alt="Logo UFSC Pixelada" class="pixel-logo-ufsc">
        
        <p style="text-align:center; color: var(--text-secondary); margin-bottom: 2rem;">Indique o limite da questão e preencha o gabarito. Assinalar valor acima do máximo zera a pontuação.</p>

        <div id="grid-blocos">
            </div>

        <div class="arcade-box" style="border-color: var(--danger-color); background: rgba(255, 51, 102, 0.05);">
            <h2 class="pixel-font bloco-titulo" style="color: var(--danger-color); border-bottom-color: var(--danger-color); margin-top: 0;">FINAL STAGE: REDAÇÃO</h2>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
                <label class="pixel-font" style="font-size: 1.3rem; color: #fff;">Insira sua nota (0.0 a 10.0):</label>
                <input type="number" id="notaRedacao" class="pixel-font" placeholder="0.0" min="0" max="10" step="0.1" oninput="processarMissao()" style="width: 150px; font-size: 1.5rem; color: var(--danger-color); border-color: var(--danger-color);">
            </div>
        </div>

        <p class="pixel-font footer-note">ALERTA: APENAS VALORES ENTRE 01 E 99 SÃO ACEITOS PELO CARTÃO-RESPOSTA.</p>
    </main>

    <script>
        const estruturaUFSC = [
            { titulo: "DIA 1: L. Portuguesa e Literatura", inicio: 1, fim: 12 },
            { titulo: "DIA 1: Segunda Língua", inicio: 13, fim: 20 },
            { titulo: "DIA 1: Matemática", inicio: 21, fim: 30 },
            { titulo: "DIA 1: Biologia", inicio: 31, fim: 40 },
            { titulo: "DIA 2: Ciências Humanas e Sociais", inicio: 41, fim: 60 },
            { titulo: "DIA 2: Física", inicio: 61, fim: 70 },
            { titulo: "DIA 2: Química", inicio: 71, fim: 80 }
        ];

        const gridBlocos = document.getElementById('grid-blocos');

        estruturaUFSC.forEach(bloco => {
            let htmlBloco = `
                <div class="arcade-box">
                    <h2 class="pixel-font bloco-titulo">${bloco.titulo}</h2>
            `;

            for (let i = bloco.inicio; i <= bloco.fim; i++) {
                htmlBloco += `
                    <div class="questão-row">
                        <span class="pixel-font" style="color:#8b949e; font-size: 1.2rem;">Q.${i.toString().padStart(2, '0')}</span>
                        <select class="pixel-font limite-select" onchange="processarMissao()">
                            <option value="64">Até 64</option>
                            <option value="32">Até 32</option>
                            <option value="16">Até 16</option>
                            <option value="8">Até 08</option>
                        </select>
                        <input type="number" class="pixel-font gabarito" placeholder="GAB" min="1" max="99" oninput="processarMissao()">
                        <input type="number" class="pixel-font resposta" placeholder="SUA" min="1" max="99" oninput="processarMissao()">
                        <div class="status-badge pixel-font score-parcial">0.00</div>
                    </div>
                `;
            }

            htmlBloco += `</div>`;
            gridBlocos.innerHTML += htmlBloco;
        });

        function getBits(n) {
            const bits = [1, 2, 4, 8, 16, 32, 64];
            return bits.filter(b => (n & b) === b);
        }

        function processarMissao() {
            const rows = document.querySelectorAll('.questão-row');
            let somaTotal = 0;

            let notaRedacao = parseFloat(document.getElementById('notaRedacao').value);
            if (!isNaN(notaRedacao)) {
                if (notaRedacao > 10) notaRedacao = 10;
                if (notaRedacao < 0) notaRedacao = 0;
                somaTotal += notaRedacao;
            }

            rows.forEach(row => {
                const maxProp = parseInt(row.querySelector('.limite-select').value);
                const gabInput = row.querySelector('.gabarito');
                const respInput = row.querySelector('.resposta');
                const display = row.querySelector('.score-parcial');

                let g = parseInt(gabInput.value);
                let r = parseInt(respInput.value);

                if (isNaN(g) || isNaN(r)) {
                    display.innerText = "0.00";
                    display.style.color = "#555";
                    return;
                }

                if (g < 1 || g > 99 || r < 1 || r > 99) {
                    display.innerText = "ERR";
                    display.style.color = "var(--danger-color)";
                    return;
                }

                const propsG = getBits(g);
                const propsR = getBits(r);

                if (propsG.some(b => b > maxProp)) {
                    display.innerText = "ERR";
                    display.style.color = "var(--danger-color)";
                    return;
                }

                if (propsR.some(b => b > maxProp)) {
                    display.innerText = "0.00";
                    display.style.color = "var(--danger-color)";
                    return;
                }

                const NTPC = propsG.length; 
                const NPC = propsR.filter(b => propsG.includes(b)).length; 
                const NPI = propsR.filter(b => !propsG.includes(b)).length; 

                let parcial = 0;
                
                if (NPC > NPI) {
                    parcial = (NPC - NPI) / NTPC;
                }

                if (r === g) parcial = 1.00; 

                display.innerText = parcial.toFixed(2);
                display.style.color = "var(--accent-color)"; 
                somaTotal += parcial;
            });

            document.getElementById('totalScore').innerText = somaTotal.toFixed(2);
        }
    </script>
</body>
</html>
